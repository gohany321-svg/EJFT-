name: Build EJFT APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip app
        run: |
          echo "Files in repo:"; ls -la
          mkdir -p www
          for f in *.zip; do unzip -o "$f" -d www; done
          if [ ! -f www/index.html ]; then
            d=$(dirname "$(find www -name index.html | head -1)")
            cp -r "$d"/. www/
          fi
          ls -la www
      - name: Setup Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '{"appId":"com.ejft.app","appName":"EJFT","webDir":"www"}' > capacitor.config.json
          npx cap add android
      - name: App icon (optional, needs icon.png inside the zip)
        continue-on-error: true
        run: |
          if [ -f www/icon.png ]; then
            mkdir -p assets && cp www/icon.png assets/icon-only.png
            npx -y @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#0b1220'
          fi
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EJFT-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
